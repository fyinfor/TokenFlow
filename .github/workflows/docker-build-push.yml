# Build TokenFlow once, push to GHCR + Alibaba ACR (linux/amd64)
# Manual only: the image_tag input is the primary image tag.
name: Docker Build & Push

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签（如 1.0.0 / v1.0.0）'
        required: true
        type: string
      push_latest:
        description: '同时推送 :latest'
        required: false
        type: boolean
        default: true

concurrency:
  group: docker-build-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  PLATFORMS: linux/amd64
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/tokenflow
  ACR_REGISTRY: crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: fyinfor123
  ACR_REPO: tokenflow

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version & tags
        id: meta
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ACR_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"

          # 手动填写的 tag 即为主镜像标签（去掉可选的 v 前缀）
          RAW_TAG="${{ inputs.image_tag }}"
          RAW_TAG="${RAW_TAG#"${RAW_TAG%%[![:space:]]*}"}"
          RAW_TAG="${RAW_TAG%"${RAW_TAG##*[![:space:]]}"}"
          if [[ -z "$RAW_TAG" ]]; then
            echo "image_tag is required" >&2
            exit 1
          fi
          VERSION="${RAW_TAG#v}"

          TAGS="${GHCR_IMAGE}:${VERSION},${ACR_IMAGE}:${VERSION}"
          if [[ "${{ inputs.push_latest }}" == "true" ]]; then
            TAGS="${TAGS},${GHCR_IMAGE}:latest,${ACR_IMAGE}:latest"
          fi

          {
            echo "version=${VERSION}"
            echo "date=${DATE}"
            echo "acr_image=${ACR_IMAGE}"
            echo "tags=${TAGS}"
          } >> "$GITHUB_OUTPUT"

          echo "Primary tag: ${VERSION}"
          echo "Image tags: ${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
            GOPROXY=https://goproxy.cn,direct
            GOSUMDB=sum.golang.google.cn
          labels: |
            org.opencontainers.image.title=tokenflow
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=tokenflow-amd64
          cache-to: type=gha,mode=max,scope=tokenflow-amd64

      - name: Summary
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          {
            echo "## Images pushed (linux/amd64)"
            echo ""
            echo "主标签: \`${VERSION}\`"
            echo ""
            echo "\`\`\`bash"
            echo "# GHCR"
            echo "docker pull ${GHCR_IMAGE}:${VERSION}"
            echo ""
            echo "# ACR"
            echo "docker login --username=\$ACR_USERNAME ${ACR_REGISTRY}"
            echo "docker pull ${{ steps.meta.outputs.acr_image }}:${VERSION}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
