# Deploy TokenFlow over SSH. Host/path auto-detected from running container — no Variables needed.
# Secrets only: LOCAL_SERVER_IP_maga, DEPLOY_USER, DEPLOY_SSH_PRIVATE_KEY, ACR_*, optional DEPLOY_SSH_PORT
name: 本地服务器IP_maga

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '要部署的镜像标签（如 1.0.0 / latest）'
        required: true
        type: string
      registry:
        description: '镜像来源'
        required: true
        type: choice
        options:
          - acr
          - ghcr
        default: acr

concurrency:
  group: deploy-tokenflow
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  ACR_REGISTRY: crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: fyinfor123
  ACR_REPO: tokenflow
  # 服务器上已有的应用容器名（用来自动定位 compose 目录）
  APP_CONTAINER: sub2api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image
        id: meta
        run: |
          set -euo pipefail
          RAW="${{ inputs.image_tag }}"
          RAW="$(echo "$RAW" | xargs)"
          VERSION="${RAW#v}"
          if [[ -z "$VERSION" ]]; then
            echo "image_tag is required" >&2
            exit 1
          fi

          if [[ "${{ inputs.registry }}" == "ghcr" ]]; then
            IMAGE="ghcr.io/${{ github.repository_owner }}/tokenflow"
          else
            IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"
          fi

          {
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "full=${IMAGE}:${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy target: ${IMAGE}:${VERSION}"

      - name: Prepare SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_SSH_PRIVATE_KEY}" ]]; then
            echo "Missing secret DEPLOY_SSH_PRIVATE_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          HOST="${{ secrets.LOCAL_SERVER_IP_maga }}"
          PORT="${{ secrets.DEPLOY_SSH_PORT || '22' }}"
          if [[ -z "$HOST" ]]; then
            echo "Missing secret LOCAL_SERVER_IP_maga" >&2
            exit 1
          fi
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy over SSH
        env:
          LOCAL_SERVER_IP_maga: ${{ secrets.LOCAL_SERVER_IP_maga }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          IMAGE_FULL: ${{ steps.meta.outputs.full }}
          REGISTRY_KIND: ${{ inputs.registry }}
          ACR_REGISTRY: ${{ env.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          APP_CONTAINER: ${{ env.APP_CONTAINER }}
        run: |
          set -euo pipefail

          : "${LOCAL_SERVER_IP_maga:?set secret LOCAL_SERVER_IP_maga}"
          : "${DEPLOY_USER:?set secret DEPLOY_USER}"

          SSH=(ssh -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            "${DEPLOY_USER}@${LOCAL_SERVER_IP_maga}")

          "${SSH[@]}" \
            IMAGE_FULL="$IMAGE_FULL" \
            REGISTRY_KIND="$REGISTRY_KIND" \
            ACR_REGISTRY="$ACR_REGISTRY" \
            ACR_USERNAME="$ACR_USERNAME" \
            ACR_PASSWORD="$ACR_PASSWORD" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            APP_CONTAINER="$APP_CONTAINER" \
            bash -s <<'REMOTE'
          set -euo pipefail

          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker info >/dev/null 2>&1; then
            DOCKER=(sudo docker)
          else
            echo "Cannot run docker on remote host (need docker or passwordless sudo)" >&2
            exit 1
          fi

          if ! "${DOCKER[@]}" inspect "$APP_CONTAINER" >/dev/null 2>&1; then
            echo "Container '$APP_CONTAINER' not found on server" >&2
            exit 1
          fi

          DEPLOY_PATH="$("${DOCKER[@]}" inspect -f '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' "$APP_CONTAINER")"
          CONFIG_FILES="$("${DOCKER[@]}" inspect -f '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$APP_CONTAINER")"
          DEPLOY_SERVICE="$("${DOCKER[@]}" inspect -f '{{ index .Config.Labels "com.docker.compose.service" }}' "$APP_CONTAINER")"
          DEPLOY_COMPOSE_FILE="${CONFIG_FILES%%,*}"
          DEPLOY_COMPOSE_FILE="$(basename "$DEPLOY_COMPOSE_FILE")"

          if [[ -z "$DEPLOY_PATH" || -z "$DEPLOY_SERVICE" ]]; then
            echo "Container '$APP_CONTAINER' is not managed by docker compose (missing labels)" >&2
            exit 1
          fi

          echo "==> Auto-detected"
          echo "    path:    $DEPLOY_PATH"
          echo "    compose: $DEPLOY_COMPOSE_FILE"
          echo "    service: $DEPLOY_SERVICE"
          cd "$DEPLOY_PATH"

          echo "==> Docker login ($REGISTRY_KIND)"
          if [[ "$REGISTRY_KIND" == "ghcr" ]]; then
            echo "$GHCR_TOKEN" | "${DOCKER[@]}" login ghcr.io -u "$GHCR_USER" --password-stdin
          else
            echo "$ACR_PASSWORD" | "${DOCKER[@]}" login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
          fi

          echo "==> Pull $IMAGE_FULL"
          "${DOCKER[@]}" pull "$IMAGE_FULL"

          printf '%s\n' \
            "services:" \
            "  ${DEPLOY_SERVICE}:" \
            "    image: ${IMAGE_FULL}" \
            > docker-compose.tokenflow.override.yml

          if "${DOCKER[@]}" compose version >/dev/null 2>&1; then
            COMPOSE=("${DOCKER[@]}" compose -f "$DEPLOY_COMPOSE_FILE" -f docker-compose.tokenflow.override.yml)
          else
            # legacy docker-compose binary
            if [[ "${DOCKER[*]}" == "sudo docker" ]]; then
              COMPOSE=(sudo docker-compose -f "$DEPLOY_COMPOSE_FILE" -f docker-compose.tokenflow.override.yml)
            else
              COMPOSE=(docker-compose -f "$DEPLOY_COMPOSE_FILE" -f docker-compose.tokenflow.override.yml)
            fi
          fi

          echo "==> Recreate service: $DEPLOY_SERVICE"
          "${COMPOSE[@]}" up -d --no-deps --force-recreate "$DEPLOY_SERVICE"

          echo "==> Status"
          "${COMPOSE[@]}" ps "$DEPLOY_SERVICE" || true
          "${DOCKER[@]}" ps --filter "name=^/${APP_CONTAINER}$" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "==> Done"
          REMOTE

      - name: Summary
        run: |
          {
            echo "## Deployed"
            echo ""
            echo "- Host: \`${{ secrets.LOCAL_SERVER_IP_maga }}\`"
            echo "- Image: \`${{ steps.meta.outputs.full }}\`"
            echo "- Path/service: auto-detected from container \`sub2api\`"
          } >> "$GITHUB_STEP_SUMMARY"
