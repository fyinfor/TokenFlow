# Deploy TokenFlow:
# - maga (本机) → GHCR 镜像
# - tokease-slave (远程) → ACR 镜像
# 默认两台一起部署，可选手动目标；slave 使用独立 SSH 密钥。
name: Deploy TokenFlow

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '要部署的镜像标签（如 1.0.0 / latest）'
        required: true
        type: string
      target:
        description: '部署目标（默认两台一起）'
        required: true
        type: choice
        options:
          - both
          - maga
          - tokease-slave
        default: both

concurrency:
  group: deploy-tokenflow-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  ACR_REGISTRY: crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: fyinfor123
  ACR_REPO: tokenflow
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/tokenflow
  REMOTE_DIR: TokenFlow/deploy
  MAGA_IP_DEFAULT: '65.49.196.156'
  MAGA_USER_DEFAULT: root
  TOKEASE_SLAVE_IP_DEFAULT: '119.91.154.55'
  TOKEASE_SLAVE_USER_DEFAULT: ubuntu

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      targets: ${{ steps.meta.outputs.targets }}
      ghcr_full: ${{ steps.meta.outputs.ghcr_full }}
      acr_full: ${{ steps.meta.outputs.acr_full }}
    steps:
      - name: Resolve version & targets
        id: meta
        run: |
          set -euo pipefail
          RAW="$(echo "${{ inputs.image_tag }}" | xargs)"
          VERSION="${RAW#v}"
          [[ -n "$VERSION" ]] || { echo "image_tag required" >&2; exit 1; }

          ACR_IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"

          case "${{ inputs.target }}" in
            maga) TARGETS='["maga"]' ;;
            tokease-slave) TARGETS='["tokease-slave"]' ;;
            both) TARGETS='["maga","tokease-slave"]' ;;
            *) echo "unknown target" >&2; exit 1 ;;
          esac

          {
            echo "version=${VERSION}"
            echo "targets=${TARGETS}"
            echo "ghcr_full=${GHCR_IMAGE}:${VERSION}"
            echo "acr_full=${ACR_IMAGE}:${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${VERSION} targets=${TARGETS}"
          echo "maga  -> ${GHCR_IMAGE}:${VERSION}"
          echo "slave -> ${ACR_IMAGE}:${VERSION}"

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets) }}
    steps:
      - name: Checkout TokenFlow
        uses: actions/checkout@v4

      - name: Resolve host & image for ${{ matrix.target }}
        id: host
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          if [[ "$TARGET" == "maga" ]]; then
            IP="${{ secrets.MAGA_IP }}"
            USER="${{ secrets.MAGA_USER }}"
            PORT="${{ secrets.MAGA_SSH_PORT }}"
            [[ -n "$IP" ]] || IP="${{ env.MAGA_IP_DEFAULT }}"
            [[ -n "$USER" ]] || USER="${{ env.MAGA_USER_DEFAULT }}"
            IMAGE_FULL="${{ needs.resolve.outputs.ghcr_full }}"
            REGISTRY_KIND="ghcr"
          else
            IP="${{ secrets.TOKEASE_SLAVE_IP }}"
            USER="${{ secrets.TOKEASE_SLAVE_USER }}"
            PORT="${{ secrets.TOKEASE_SLAVE_SSH_PORT }}"
            [[ -n "$IP" ]] || IP="${{ env.TOKEASE_SLAVE_IP_DEFAULT }}"
            [[ -n "$USER" ]] || USER="${{ env.TOKEASE_SLAVE_USER_DEFAULT }}"
            IMAGE_FULL="${{ needs.resolve.outputs.acr_full }}"
            REGISTRY_KIND="acr"
          fi
          [[ -n "$PORT" ]] || PORT="22"
          {
            echo "ip=${IP}"
            echo "user=${USER}"
            echo "port=${PORT}"
            echo "image_full=${IMAGE_FULL}"
            echo "registry_kind=${REGISTRY_KIND}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy ${TARGET} -> ${USER}@${IP}:${PORT} image=${IMAGE_FULL}"

      - name: Prepare SSH
        env:
          MAGA_KEY: ${{ secrets.MAGA_SSH_PRIVATE_KEY }}
          SLAVE_KEY: ${{ secrets.TOKEASE_SLAVE_SSH_PRIVATE_KEY }}
          TARGET: ${{ matrix.target }}
          HOST_IP: ${{ steps.host.outputs.ip }}
          HOST_PORT: ${{ steps.host.outputs.port }}
        run: |
          set -euo pipefail
          if [[ "$TARGET" == "maga" ]]; then
            KEY="$MAGA_KEY"
            KEY_NAME="MAGA_SSH_PRIVATE_KEY"
          else
            KEY="$SLAVE_KEY"
            KEY_NAME="TOKEASE_SLAVE_SSH_PRIVATE_KEY"
          fi
          if [[ -z "$KEY" ]]; then
            echo "Missing secret ${KEY_NAME}" >&2
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$HOST_PORT" -H "$HOST_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync deploy/ to ${{ matrix.target }}
        env:
          HOST_IP: ${{ steps.host.outputs.ip }}
          HOST_USER: ${{ steps.host.outputs.user }}
          HOST_PORT: ${{ steps.host.outputs.port }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
        run: |
          set -euo pipefail
          SSH_OPTS=(-i ~/.ssh/deploy_key -p "$HOST_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          REMOTE="${HOST_USER}@${HOST_IP}"
          ssh "${SSH_OPTS[@]}" "$REMOTE" "mkdir -p \"\$HOME/${REMOTE_DIR}\""
          RSYNC_RSH="ssh -i ~/.ssh/deploy_key -p ${HOST_PORT} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'postgres_data/' \
            --exclude 'redis_data/' \
            -e "$RSYNC_RSH" \
            deploy/ "${REMOTE}:~/${REMOTE_DIR}/"

      - name: Pull image and start on ${{ matrix.target }}
        env:
          HOST_IP: ${{ steps.host.outputs.ip }}
          HOST_USER: ${{ steps.host.outputs.user }}
          HOST_PORT: ${{ steps.host.outputs.port }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          IMAGE_FULL: ${{ steps.host.outputs.image_full }}
          REGISTRY_KIND: ${{ steps.host.outputs.registry_kind }}
          ACR_REGISTRY: ${{ env.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/deploy_key -p "$HOST_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            "${HOST_USER}@${HOST_IP}")

          "${SSH[@]}" \
            REMOTE_DIR="$REMOTE_DIR" \
            IMAGE_FULL="$IMAGE_FULL" \
            REGISTRY_KIND="$REGISTRY_KIND" \
            ACR_REGISTRY="$ACR_REGISTRY" \
            ACR_USERNAME="$ACR_USERNAME" \
            ACR_PASSWORD="$ACR_PASSWORD" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            TARGET_NAME="${{ matrix.target }}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/$REMOTE_DIR"

          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker info >/dev/null 2>&1; then
            DOCKER=(sudo docker)
          else
            echo "Cannot run docker on ${TARGET_NAME}" >&2
            exit 1
          fi

          if [[ ! -f .env ]]; then
            cp .env.example .env
            PW="$(openssl rand -hex 16)"
            JWT="$(openssl rand -hex 32)"
            sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=${PW}/" .env
            if grep -q '^JWT_SECRET=' .env; then
              sed -i "s/^JWT_SECRET=.*/JWT_SECRET=${JWT}/" .env
            else
              echo "JWT_SECRET=${JWT}" >> .env
            fi
            echo "==> Created .env with generated secrets"
          fi
          if grep -q '^SERVER_PORT=' .env; then
            sed -i 's/^SERVER_PORT=.*/SERVER_PORT=8080/' .env
          else
            echo 'SERVER_PORT=8080' >> .env
          fi

          echo "==> Docker login ($REGISTRY_KIND) for ${TARGET_NAME}"
          if [[ "$REGISTRY_KIND" == "ghcr" ]]; then
            echo "$GHCR_TOKEN" | "${DOCKER[@]}" login ghcr.io -u "$GHCR_USER" --password-stdin
          else
            : "${ACR_USERNAME:?Missing ACR_USERNAME}"
            : "${ACR_PASSWORD:?Missing ACR_PASSWORD}"
            echo "$ACR_PASSWORD" | "${DOCKER[@]}" login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
          fi

          echo "==> Pull $IMAGE_FULL"
          "${DOCKER[@]}" pull "$IMAGE_FULL"

          # 只覆盖应用镜像；postgres/redis 沿用 compose 原名
          printf '%s\n' \
            'services:' \
            '  sub2api:' \
            "    image: ${IMAGE_FULL}" \
            '    container_name: tokenflow' \
            > docker-compose.tokenflow.override.yml

          # 重复部署必须沿用已有 compose project，否则会因 container_name 冲突失败
          PROJECT="tokenflow"
          if "${DOCKER[@]}" inspect tokenflow >/dev/null 2>&1; then
            PROJECT="$("${DOCKER[@]}" inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' tokenflow)"
          elif "${DOCKER[@]}" inspect sub2api-redis >/dev/null 2>&1; then
            PROJECT="$("${DOCKER[@]}" inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' sub2api-redis)"
          elif "${DOCKER[@]}" inspect sub2api >/dev/null 2>&1; then
            PROJECT="$("${DOCKER[@]}" inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' sub2api)"
          fi
          [[ -n "$PROJECT" && "$PROJECT" != "<no value>" ]] || PROJECT="tokenflow"
          echo "==> Compose project: ${PROJECT}"

          if "${DOCKER[@]}" compose version >/dev/null 2>&1; then
            COMPOSE=("${DOCKER[@]}" compose -p "$PROJECT" -f docker-compose.yml -f docker-compose.tokenflow.override.yml)
          else
            if [[ "${DOCKER[*]}" == "sudo docker" ]]; then
              COMPOSE=(sudo docker-compose -p "$PROJECT" -f docker-compose.yml -f docker-compose.tokenflow.override.yml)
            else
              COMPOSE=(docker-compose -p "$PROJECT" -f docker-compose.yml -f docker-compose.tokenflow.override.yml)
            fi
          fi

          echo "==> Starting/updating TokenFlow on ${TARGET_NAME} at $HOME/$REMOTE_DIR (port 8080)"
          # 先保证依赖在跑，再强制重建应用容器以切换镜像（不新建同名 postgres/redis）
          "${COMPOSE[@]}" up -d postgres redis
          "${COMPOSE[@]}" up -d --no-deps --force-recreate sub2api
          "${COMPOSE[@]}" up -d --remove-orphans
          "${COMPOSE[@]}" ps
          "${DOCKER[@]}" ps --filter "name=tokenflow" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          echo "==> Done (${TARGET_NAME})"
          REMOTE

      - name: Summary
        run: |
          {
            echo "## Deployed to \`${{ matrix.target }}\`"
            echo "- Host: \`${{ steps.host.outputs.user }}@${{ steps.host.outputs.ip }}\`"
            echo "- Registry: \`${{ steps.host.outputs.registry_kind }}\`"
            echo "- Image: \`${{ steps.host.outputs.image_full }}\`"
            echo "- Dir: \`~/${{ env.REMOTE_DIR }}\`"
            echo "- App port: \`8080\`"
          } >> "$GITHUB_STEP_SUMMARY"
