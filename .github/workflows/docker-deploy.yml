# Deploy TokenFlow to MAGA server (ubuntu@119.91.154.55).
# Syncs this repo's deploy/ into ~/TokenFlow/deploy on the server, then pulls & starts the image.
name: 本地服务器IP_maga

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '要部署的镜像标签（如 1.0.0 / latest）'
        required: true
        type: string
      registry:
        description: '镜像来源'
        required: true
        type: choice
        options:
          - acr
          - ghcr
        default: acr

concurrency:
  group: deploy-tokenflow-maga
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  ACR_REGISTRY: crpi-sk2z151c9de4cnvh.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: fyinfor123
  ACR_REPO: tokenflow
  # MAGA 服务器（可被 Secret 覆盖）
  MAGA_IP: 119.91.154.55
  MAGA_USER: ubuntu
  # 与服务器上项目路径对齐：~/TokenFlow/deploy
  REMOTE_DIR: TokenFlow/deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TokenFlow
        uses: actions/checkout@v4

      - name: Resolve image
        id: meta
        run: |
          set -euo pipefail
          RAW="$(echo "${{ inputs.image_tag }}" | xargs)"
          VERSION="${RAW#v}"
          if [[ -z "$VERSION" ]]; then
            echo "image_tag is required" >&2
            exit 1
          fi

          if [[ "${{ inputs.registry }}" == "ghcr" ]]; then
            IMAGE="ghcr.io/${{ github.repository_owner }}/tokenflow"
          else
            IMAGE="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"
          fi

          {
            echo "version=${VERSION}"
            echo "full=${IMAGE}:${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy TokenFlow image: ${IMAGE}:${VERSION}"

      - name: Resolve MAGA target
        id: target
        run: |
          set -euo pipefail
          IP="${{ secrets.MAGA_IP }}"
          USER="${{ secrets.MAGA_USER }}"
          PORT="${{ secrets.MAGA_SSH_PORT }}"
          [[ -n "$IP" ]] || IP="${{ env.MAGA_IP }}"
          [[ -n "$USER" ]] || USER="${{ env.MAGA_USER }}"
          [[ -n "$PORT" ]] || PORT="22"
          {
            echo "ip=${IP}"
            echo "user=${USER}"
            echo "port=${PORT}"
          } >> "$GITHUB_OUTPUT"
          echo "Target: ${USER}@${IP}:${PORT}"

      - name: Prepare SSH
        env:
          MAGA_SSH_PRIVATE_KEY: ${{ secrets.MAGA_SSH_PRIVATE_KEY }}
          MAGA_IP: ${{ steps.target.outputs.ip }}
          MAGA_SSH_PORT: ${{ steps.target.outputs.port }}
        run: |
          set -euo pipefail
          : "${MAGA_SSH_PRIVATE_KEY:?Missing secret MAGA_SSH_PRIVATE_KEY}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MAGA_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$MAGA_SSH_PORT" -H "$MAGA_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync TokenFlow deploy/ to MAGA server
        env:
          MAGA_IP: ${{ steps.target.outputs.ip }}
          MAGA_USER: ${{ steps.target.outputs.user }}
          MAGA_SSH_PORT: ${{ steps.target.outputs.port }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
        run: |
          set -euo pipefail

          SSH_OPTS=(-i ~/.ssh/deploy_key -p "$MAGA_SSH_PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new)
          REMOTE="${MAGA_USER}@${MAGA_IP}"

          ssh "${SSH_OPTS[@]}" "$REMOTE" "mkdir -p \"\$HOME/${REMOTE_DIR}\""

          RSYNC_RSH="ssh -i ~/.ssh/deploy_key -p ${MAGA_SSH_PORT} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'data/' \
            --exclude 'postgres_data/' \
            --exclude 'redis_data/' \
            -e "$RSYNC_RSH" \
            deploy/ "${REMOTE}:~/${REMOTE_DIR}/"

      - name: Pull image and start TokenFlow
        env:
          MAGA_IP: ${{ steps.target.outputs.ip }}
          MAGA_USER: ${{ steps.target.outputs.user }}
          MAGA_SSH_PORT: ${{ steps.target.outputs.port }}
          REMOTE_DIR: ${{ env.REMOTE_DIR }}
          IMAGE_FULL: ${{ steps.meta.outputs.full }}
          REGISTRY_KIND: ${{ inputs.registry }}
          ACR_REGISTRY: ${{ env.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail

          SSH=(ssh -i ~/.ssh/deploy_key -p "$MAGA_SSH_PORT"
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            "${MAGA_USER}@${MAGA_IP}")

          "${SSH[@]}" \
            REMOTE_DIR="$REMOTE_DIR" \
            IMAGE_FULL="$IMAGE_FULL" \
            REGISTRY_KIND="$REGISTRY_KIND" \
            ACR_REGISTRY="$ACR_REGISTRY" \
            ACR_USERNAME="$ACR_USERNAME" \
            ACR_PASSWORD="$ACR_PASSWORD" \
            GHCR_USER="$GHCR_USER" \
            GHCR_TOKEN="$GHCR_TOKEN" \
            bash -s <<'REMOTE'
          set -euo pipefail
          cd "$HOME/$REMOTE_DIR"

          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker info >/dev/null 2>&1; then
            DOCKER=(sudo docker)
          else
            echo "Cannot run docker (need docker group or passwordless sudo)" >&2
            exit 1
          fi

          if [[ ! -f .env ]]; then
            cp .env.example .env
            PW="$(openssl rand -hex 16)"
            JWT="$(openssl rand -hex 32)"
            sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=${PW}/" .env
            if grep -q '^JWT_SECRET=' .env; then
              sed -i "s/^JWT_SECRET=.*/JWT_SECRET=${JWT}/" .env
            else
              echo "JWT_SECRET=${JWT}" >> .env
            fi
            echo "==> Created .env with generated secrets"
          fi

          echo "==> Docker login ($REGISTRY_KIND)"
          if [[ "$REGISTRY_KIND" == "ghcr" ]]; then
            echo "$GHCR_TOKEN" | "${DOCKER[@]}" login ghcr.io -u "$GHCR_USER" --password-stdin
          else
            echo "$ACR_PASSWORD" | "${DOCKER[@]}" login "$ACR_REGISTRY" -u "$ACR_USERNAME" --password-stdin
          fi

          echo "==> Pull TokenFlow image: $IMAGE_FULL"
          "${DOCKER[@]}" pull "$IMAGE_FULL"

          printf '%s\n' \
            "services:" \
            "  sub2api:" \
            "    image: ${IMAGE_FULL}" \
            "    container_name: tokenflow" \
            > docker-compose.tokenflow.override.yml

          if "${DOCKER[@]}" compose version >/dev/null 2>&1; then
            COMPOSE=("${DOCKER[@]}" compose -f docker-compose.yml -f docker-compose.tokenflow.override.yml)
          else
            if [[ "${DOCKER[*]}" == "sudo docker" ]]; then
              COMPOSE=(sudo docker-compose -f docker-compose.yml -f docker-compose.tokenflow.override.yml)
            else
              COMPOSE=(docker-compose -f docker-compose.yml -f docker-compose.tokenflow.override.yml)
            fi
          fi

          echo "==> Starting TokenFlow at $HOME/$REMOTE_DIR"
          "${COMPOSE[@]}" up -d

          echo "==> Status"
          "${COMPOSE[@]}" ps
          "${DOCKER[@]}" ps --filter "name=tokenflow" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "==> Done"
          REMOTE

      - name: Summary
        run: |
          {
            echo "## TokenFlow deployed to MAGA"
            echo ""
            echo "- Host: \`${{ steps.target.outputs.user }}@${{ steps.target.outputs.ip }}\`"
            echo "- Remote dir: \`~/${{ env.REMOTE_DIR }}\`"
            echo "- Image: \`${{ steps.meta.outputs.full }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
